[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "projectcontrol"
version = "1.0.0"
description = "Control panel for launching, restarting and watching local projects"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.110",
    "uvicorn[standard]>=0.27",
    "pydantic>=2.6",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "httpx>=0.27"]

[project.scripts]
projectcontrol = "projectcontrol.__main__:main"

[tool.setuptools.packages.find]
include = ["projectcontrol*"]

[tool.setuptools.package-data]
projectcontrol = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-p no:cacheprovider --basetemp=.pytest_tmp"
